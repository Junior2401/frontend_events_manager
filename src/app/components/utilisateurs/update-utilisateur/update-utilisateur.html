<div class="card shadow-sm border-0 mb-4 overflow-hidden">
  <div class="card-header bg-white border-bottom py-3">
    <div class="d-flex align-items-center">
      <div class="bg-warning bg-opacity-10 p-2 rounded-circle me-3">
        <i class="bi bi-pencil-square text-warning fs-4"></i>
      </div>
      <div>
        <h5 class="card-title mb-0 fw-bold">Modifier l'Utilisateur</h5>
        <small class="text-muted">Mise à jour des informations du profil</small>
      </div>
    </div>
  </div>

  <div *ngIf="isLoading" class="card-body text-center py-5">
    <div class="spinner-border text-warning" style="width: 3rem; height: 3rem;" role="status"></div>
    <p class="text-muted mt-3">Chargement des données...</p>
  </div>

  <form *ngIf="!isLoading" [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="card-body p-4">
      <div class="row g-4">
        <div class="col-md-6">
          <label class="form-label fw-semibold">Nom <span class="text-danger">*</span></label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="bi bi-person"></i></span>
            <input class="form-control border-start-0 ps-0" formControlName="nom" 
                   [class.is-invalid]="form.get('nom')?.touched && form.get('nom')?.invalid">
            <div class="invalid-feedback">Le nom de famille est requis.</div>
          </div>
        </div>

        <div class="col-md-6">
          <label class="form-label fw-semibold">Prénom <span class="text-danger">*</span></label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="bi bi-person"></i></span>
            <input class="form-control border-start-0 ps-0" formControlName="prenom" 
                   [class.is-invalid]="form.get('prenom')?.touched && form.get('prenom')?.invalid">
            <div class="invalid-feedback">Le prénom est requis.</div>
          </div>
        </div>

        <div class="col-md-6">
          <label class="form-label fw-semibold">Adresse Email <span class="text-danger">*</span></label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope-at"></i></span>
            <input class="form-control border-start-0 ps-0" type="email" formControlName="email" 
                   [class.is-invalid]="form.get('email')?.touched && form.get('email')?.invalid">
            <div class="invalid-feedback" *ngIf="form.get('email')?.errors?.['required']">L'adresse email est obligatoire.</div>
            <div class="invalid-feedback" *ngIf="form.get('email')?.errors?.['email']">Veuillez entrer une adresse email valide.</div>
          </div>
        </div>

        <div class="col-md-6">
          <label class="form-label fw-semibold">Téléphone <span class="text-danger">*</span></label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="bi bi-telephone"></i></span>
            <input class="form-control border-start-0 ps-0" formControlName="telephone" 
                   [class.is-invalid]="form.get('telephone')?.touched && form.get('telephone')?.invalid">
            <div class="invalid-feedback">Le numéro de téléphone est requis.</div>
          </div>
        </div>
      </div>
    </div>

    <div class="card-footer bg-light border-top py-3 d-flex justify-content-end gap-2">
      <button type="button" class="btn btn-outline-secondary rounded-pill px-4" (click)="onBack()">
        Annuler
      </button>
      <button type="submit" class="btn btn-warning rounded-pill px-4 shadow-sm" [disabled]="isSubmitting">
        <span *ngIf="isSubmitting" class="spinner-border spinner-border-sm me-2"></span>
        Enregistrer les modifications <i class="bi bi-check-circle ms-1"></i>
      </button>
    </div>
  </form>
</div>
