<div class="card shadow-sm border-0 mb-4 overflow-hidden">
  <div class="card-header bg-white border-bottom py-3">
    <div class="d-flex align-items-center">
      <div class="bg-warning bg-opacity-10 p-2 rounded-circle me-3">
        <i class="bi bi-pencil-square text-warning fs-4"></i>
      </div>
      <div>
        <h5 class="card-title mb-0 fw-bold">Modifier l'Artiste</h5>
        <small class="text-muted">Mise à jour du profil de performance</small>
      </div>
    </div>
  </div>

  <div *ngIf="isLoading" class="card-body text-center py-5">
    <div class="spinner-border text-warning" style="width: 3rem; height: 3rem;" role="status"></div>
    <p class="text-muted mt-3">Chargement du profil...</p>
  </div>

  <form *ngIf="!isLoading" [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="card-body p-4">
      <div class="row g-4">
        <!-- Nom de scène en vedette -->
        <div class="col-12">
          <div class="p-3 bg-light rounded-3 border-start border-warning border-4 mb-2 shadow-xs">
            <label class="form-label fw-bold text-dark small text-uppercase">Nom de scène / Pseudo <span class="text-danger">*</span></label>
            <div class="input-group input-group-lg">
              <span class="input-group-text bg-white border-end-0"><i class="bi bi-mic-fill text-warning"></i></span>
              <input class="form-control border-start-0 ps-0 fw-bold" formControlName="nomDeScene" placeholder="Ex: DJ Shadow" 
                     [class.is-invalid]="form.get('nomDeScene')?.touched && form.get('nomDeScene')?.invalid">
              <div class="invalid-feedback">Le nom de scène est requis.</div>
            </div>
          </div>
        </div>

        <div class="col-md-6">
          <label class="form-label fw-semibold">Nom Civil <span class="text-danger">*</span></label>
          <input class="form-control" formControlName="nom" placeholder="Nom de famille" 
                 [class.is-invalid]="form.get('nom')?.touched && form.get('nom')?.invalid">
          <div class="invalid-feedback">Le nom est requis.</div>
        </div>

        <div class="col-md-6">
          <label class="form-label fw-semibold">Prénom Civil <span class="text-danger">*</span></label>
          <input class="form-control" formControlName="prenom" placeholder="Prénom" 
                 [class.is-invalid]="form.get('prenom')?.touched && form.get('prenom')?.invalid">
          <div class="invalid-feedback">Le prénom est requis.</div>
        </div>

        <div class="col-md-6">
          <label class="form-label fw-semibold">Adresse Email <span class="text-danger">*</span></label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope"></i></span>
            <input class="form-control border-start-0 ps-0" type="email" formControlName="email" placeholder="contact@artiste.com" 
                   [class.is-invalid]="form.get('email')?.touched && form.get('email')?.invalid">
            <div class="invalid-feedback">Un email valide est requis.</div>
          </div>
        </div>

        <div class="col-md-6">
          <label class="form-label fw-semibold">Style Artistique <span class="text-danger">*</span></label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="bi bi-music-note-list"></i></span>
            <select class="form-select border-start-0 ps-0" formControlName="styleArtistique" 
                    [class.is-invalid]="form.get('styleArtistique')?.touched && form.get('styleArtistique')?.invalid">
              <option value="" disabled>-- Sélectionner un genre --</option>
              <option *ngFor="let style of stylesArtistiques" [value]="style">{{ style }}</option>
            </select>
            <div class="invalid-feedback">Veuillez spécifier le style.</div>
          </div>
        </div>
      </div>
    </div>

    <div class="card-footer bg-light border-top py-3 d-flex justify-content-end gap-2">
      <button type="button" class="btn btn-outline-secondary rounded-pill px-4" (click)="onBack()">
        Annuler
      </button>
      <button type="submit" class="btn btn-warning rounded-pill px-4 shadow-sm" [disabled]="isSubmitting">
        <span *ngIf="isSubmitting" class="spinner-border spinner-border-sm me-2"></span>
        Mettre à jour le profil <i class="bi bi-check-circle ms-1"></i>
      </button>
    </div>
  </form>
</div>
