<div class="card shadow-sm border-0 mb-4 overflow-hidden">
  <div class="card-header bg-white border-bottom py-3">
    <div class="d-flex align-items-center">
      <div class="bg-warning bg-opacity-10 p-2 rounded-circle me-3">
        <i class="bi bi-person-gear text-warning fs-4"></i>
      </div>
      <div>
        <h5 class="card-title mb-0 fw-bold">Modifier l'Administrateur</h5>
        <small class="text-muted">Ajustement des permissions et informations</small>
      </div>
    </div>
  </div>

  <div *ngIf="isLoading" class="card-body text-center py-5">
    <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status"></div>
    <p class="text-muted mt-3">Chargement du profil admin...</p>
  </div>

  <form *ngIf="!isLoading" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <div class="card-body p-4">
      <div class="row g-4">
        <div class="col-md-6">
          <label class="form-label fw-semibold">Nom <span class="text-danger">*</span></label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="bi bi-person"></i></span>
            <input class="form-control border-start-0 ps-0" formControlName="nom" placeholder="Nom" 
                   [class.is-invalid]="form.get('nom')?.touched && form.get('nom')?.invalid">
            <div class="invalid-feedback">Le nom est requis.</div>
          </div>
        </div>

        <div class="col-md-6">
          <label class="form-label fw-semibold">Prénom <span class="text-danger">*</span></label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="bi bi-person"></i></span>
            <input class="form-control border-start-0 ps-0" formControlName="prenom" placeholder="Prénom" 
                   [class.is-invalid]="form.get('prenom')?.touched && form.get('prenom')?.invalid">
            <div class="invalid-feedback">Le prénom est requis.</div>
          </div>
        </div>

        <div class="col-md-6">
          <label class="form-label fw-semibold">Email de connexion <span class="text-danger">*</span></label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope-at"></i></span>
            <input class="form-control border-start-0 ps-0" type="email" formControlName="email" placeholder="email@exemple.com" 
                   [class.is-invalid]="form.get('email')?.touched && form.get('email')?.invalid">
            <div class="invalid-feedback">Un email valide est requis.</div>
          </div>
        </div>

        <div class="col-md-6">
          <label class="form-label fw-semibold">Rôle attribué <span class="text-danger">*</span></label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="bi bi-shield-lock"></i></span>
            <select class="form-select border-start-0 ps-0" formControlName="role" 
                    [class.is-invalid]="form.get('role')?.touched && form.get('role')?.invalid">
              <option value="" disabled>-- Sélectionner un rôle --</option>
              <option value="SUPER_ADMIN">Super Administrateur</option>
              <option value="ADMIN">Administrateur</option>
              <option value="MANAGER">Manager</option>
              <option value="USER">Utilisateur</option>
              <option value="VIEWER">Lecteur</option>
            </select>
            <div class="invalid-feedback">Le rôle est obligatoire.</div>
          </div>
        </div>
      </div>

      <div class="mt-4 pt-3 border-top">
        <div class="alert alert-light border-0 mb-0 d-flex align-items-center bg-light">
          <i class="bi bi-info-circle me-3 text-primary fs-5"></i>
          <div class="small">
            Toute modification du rôle prendra effet dès la prochaine connexion de l'utilisateur.
          </div>
        </div>
      </div>
    </div>

    <div class="card-footer bg-light border-top py-3 d-flex justify-content-end gap-2">
      <button type="button" class="btn btn-outline-secondary rounded-pill px-4" (click)="onBack()">
        Annuler
      </button>
      <button type="submit" class="btn btn-warning rounded-pill px-4 shadow-sm" [disabled]="isSubmitting">
        <span *ngIf="isSubmitting" class="spinner-border spinner-border-sm me-2"></span>
        Mettre à jour le profil <i class="bi bi-check-circle ms-1"></i>
      </button>
    </div>
  </form>
</div>
