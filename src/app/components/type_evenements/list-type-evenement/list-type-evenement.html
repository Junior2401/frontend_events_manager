<div class="card shadow-sm border-0 mb-4 overflow-hidden">
  <div class="card-header bg-white border-bottom py-3">
    <div class="d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center">
        <div class="bg-primary bg-opacity-10 p-2 rounded-circle me-3">
          <i class="bi bi-diagram-3 text-primary fs-4"></i>
        </div>
        <div>
          <h5 class="card-title mb-0 fw-bold">Types d'Événements</h5>
          <small class="text-muted">{{ typeEvenements.length }} catégorie(s) définie(s)</small>
        </div>
      </div>
      <button class="btn btn-primary rounded-pill px-4 shadow-sm" [routerLink]="['/type-evenements/create']">
        <i class="bi bi-plus-circle-fill me-2"></i> Ajouter un type
      </button>
    </div>
  </div>

  <div class="card-body p-0">
    <!-- Notification -->
    <div *ngIf="notification" class="p-3">
      <div [class]="'alert alert-' + notification.type + ' border-0 shadow-sm d-flex align-items-center'" role="alert">
        <i [class]="notification.type === 'success' ? 'bi bi-check-circle-fill fs-5 me-3' : 'bi bi-exclamation-triangle-fill fs-5 me-3'"></i>
        <div class="flex-grow-1">{{ notification.message }}</div>
        <button type="button" class="btn-close" (click)="closeNotification()" aria-label="Close"></button>
      </div>
    </div>

    <!-- Spinner chargement -->
    <div *ngIf="isLoading" class="text-center py-5">
      <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status"></div>
      <p class="text-muted mt-3">Chargement des catégories...</p>
    </div>

    <div *ngIf="!isLoading" class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="bg-light text-muted small text-uppercase fw-bold">
          <tr>
            <th class="ps-4" style="width: 50px;">#</th>
            <th>Libellé</th>
            <th>Description</th>
            <th class="text-end pe-4">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of typeEvenements; let i = index">
            <td class="ps-4 text-muted">{{ i + 1 }}</td>
            <td>
              <div class="d-flex align-items-center">
                <div class="bg-light p-2 rounded-3 me-3">
                  <i class="bi bi-tag text-primary"></i>
                </div>
                <div class="fw-bold text-dark">{{ item.libelle }}</div>
              </div>
            </td>
            <td>
              <span class="text-muted small">{{ item.description || 'Pas de description' }}</span>
            </td>
            <td class="text-end pe-4">
              <div class="d-flex justify-content-end gap-2">
                <button class="btn btn-sm btn-outline-info rounded-circle shadow-xs" title="Détail" [routerLink]="['/type-evenements/detail', item.id]">
                  <i class="bi bi-eye"></i>
                </button>
                <button class="btn btn-sm btn-outline-primary rounded-circle shadow-xs" title="Modifier" [routerLink]="['/type-evenements/edit', item.id]">
                  <i class="bi bi-pencil"></i>
                </button>
                <button class="btn btn-sm btn-outline-danger rounded-circle shadow-xs" title="Supprimer" [routerLink]="['/type-evenements/delete', item.id]">
                  <i class="bi bi-trash"></i>
                </button>
              </div>
            </td>
          </tr>

          <!-- État vide -->
          <tr *ngIf="typeEvenements.length === 0">
            <td colspan="4" class="text-center py-5">
              <div class="py-4">
                <i class="bi bi-folder-x text-muted" style="font-size: 3rem;"></i>
                <p class="text-muted mt-3">Aucun type d'événement configuré.</p>
                <button class="btn btn-sm btn-primary rounded-pill mt-2" [routerLink]="['/type-evenements/create']">
                  Créer une catégorie
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="card-footer bg-white border-0 py-2"></div>
</div>
