<div class="card shadow-sm border-0 mb-4 overflow-hidden">
  <div class="card-header bg-white border-bottom py-3">
    <div class="d-flex align-items-center">
      <div class="bg-danger bg-opacity-10 p-2 rounded-circle me-3">
        <i class="bi bi-exclamation-triangle text-danger fs-4"></i>
      </div>
      <div>
        <h5 class="card-title mb-0 fw-bold">Confirmation de Suppression</h5>
        <small class="text-muted">Cette action retirera définitivement l'événement</small>
      </div>
    </div>
  </div>

  <div *ngIf="isLoading" class="card-body text-center py-5">
    <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status"></div>
    <p class="text-muted mt-3">Vérification des dépendances...</p>
  </div>

  <div *ngIf="!isLoading && evenement" class="card-body text-center py-5">
    <div class="mb-4">
      <i class="bi bi-trash3 text-danger opacity-25" style="font-size: 5rem;"></i>
    </div>
    <p class="fs-5 px-md-5">
      Êtes-vous absolument sûr de vouloir supprimer l'événement 
      <strong class="text-dark">{{ evenement.libelle }}</strong> ?
    </p>
    <div class="alert alert-warning border-0 mx-md-5 mt-4 d-inline-block bg-opacity-10 text-dark small">
      <i class="bi bi-info-circle-fill me-2 text-warning"></i>
      Attention : Cette action est irréversible et supprimera également les données associées.
    </div>
  </div>

  <div class="card-footer bg-light border-top py-3">
    <div class="d-flex justify-content-center gap-3">
      <button class="btn btn-outline-secondary rounded-pill px-5" (click)="onBack()">
        <i class="bi bi-arrow-left-circle me-2"></i> Annuler
      </button>
      <button class="btn btn-danger rounded-pill px-5 shadow-sm" (click)="onDelete()" [disabled]="isSubmitting">
        <span *ngIf="isSubmitting" class="spinner-border spinner-border-sm me-2"></span>
        <i *ngIf="!isSubmitting" class="bi bi-trash-fill me-2"></i> Confirmer la suppression
      </button>
    </div>
  </div>
</div>
